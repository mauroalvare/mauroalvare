# Keeps the profile README up to date on its own, once a day.
# - README "Lately..." line and "Projects" table: rebuilt from your repositories and pull requests.
# - contributions.svg: repositories you don't own where you have pull requests (found automatically).
# - github-snake*.svg: optional contribution snake (only shown if you add it to the README).
# To keep a repository out of "Projects", add its name to HIDE_REPOS below (or archive it).
name: Update profile cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  HIDE_REPOS: mompenaltodibu,labprog1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Update README sections
        run: |
          python3 .github/scripts/update_readme.py "${{ github.repository_owner }}" README.md
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update profile README sections" README.md
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contributions card
        run: python3 .github/scripts/contributions.py "${{ github.repository_owner }}" dist/contributions.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake (optional)
        uses: Platane/snk@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
